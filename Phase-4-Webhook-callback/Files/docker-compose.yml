services:
  order-db:
    image: postgres:18
    container_name: order-db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: orderdb
    ports:
      - "5433:5432"
    volumes:
      - order-db-data:/var/lib/postgresql

  inventory-db:
    image: postgres:18
    container_name: inventory-db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: inventorydb
    ports:
      - "5434:5432"
    volumes:
      - inventory-db-data:/var/lib/postgresql

  payment-db:
    image: postgres:18
    container_name: payment-db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: paymentdb
    ports:
      - "5435:5432"
    volumes:
      - payment-db-data:/var/lib/postgresql

  saga-db:
    image: postgres:18
    container_name: saga-db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: sagadb
    ports:
      - "5436:5432"
    volumes:
      - saga-db-data:/var/lib/postgresql

  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data

volumes:
  order-db-data:
  inventory-db-data:
  payment-db-data:
  saga-db-data:
  kafka-data:

#  1) To clean-restart just Kafka (leave the DBs alone)
#
#  docker-compose stop kafka
#  docker-compose rm -f kafka
#  docker volume rm files_kafka-data
#  docker-compose up -d kafka

#  stop — stops the container
#  rm -f — deletes the stopped container (image stays cached locally, so this doesn't re-download anything)
#  docker volume rm files_kafka-data — this is the actual "wipe the data" step; without it, up -d just reattaches the same volume and you're not clean
#  up -d kafka — recreates the container fresh from the image, with a brand-new empty volume
#  Volume name depends on your compose project (folder) name — confirm with docker volume ls | grep kafka if files_kafka-data doesn't match.
#
#eg for above configuration
#  docker compose stop kafka
#  docker compose rm -f kafka
#  docker volume rm kafka-data
#  docker compose up -d kafka
#
# 2)  If you want to clean-restart everything (Kafka + all 3 DBs)
#  bash
#  docker-compose down -v
#  docker-compose up -d
#
#  down -v is the one flag to be careful with — it stops and removes containers and deletes every volume declared in the compose file in one shot (all 3 Postgres DBs + Kafka).
#  Good for a full fresh start of the whole stack; bad if you only meant to reset Kafka and forgot you had test data in order-db.
